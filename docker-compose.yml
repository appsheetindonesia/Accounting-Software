# ============================================================
# Docker Compose — Accounting Software
#
# Opsi 1: Build lokal
#   docker-compose up --build
#
# Opsi 2: Pull dari GHCR (GitHub Container Registry)
#   docker-compose -f docker-compose.yml -f docker-compose.ghcr.yml up
#
# Opsi 3: Easypanel — Auto-detect file ini
#   Easypanel akan mendeteksi docker-compose.yml ini.
#   Set build context ke repo root.
#
# Opsi 4: Easypanel Nixpacks
#   Easypanel akan mendeteksi nixpacks.toml ini.
#   Pilih builder: Nixpacks di Easypanel dashboard.
#
# Opsi 5: Easypanel Railpack
#   Easypanel akan mendeteksi railpack.toml ini.
#   Pilih builder: Railpack di Easypanel dashboard.
#
# Opsi 6: Easypanel Buildpack
#   Easypanel akan mendeteksi Procfile ini.
#   Pilih builder: Buildpack di Easypanel dashboard.
# ============================================================

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MOCK_API_PERSIST=1
      # PostgreSQL koneksi nyata — isi DATABASE_URL untuk mode production
      # Format: postgresql://user:password@host:port/database?sslmode=disable
      # Contoh: postgresql://postgres:mypass@213.199.45.184:5432/appsheetindonesia?sslmode=disable
      # Kosongkan atau hapus baris ini untuk mode in-memory (default)
      # - DATABASE_URL=postgresql://postgres:password@host:5432/dbname?sslmode=disable
    volumes:
      - app-data:/app/mock-api/.data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app-data:

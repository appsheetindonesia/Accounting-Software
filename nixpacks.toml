# ============================================================
# Nixpacks — Accounting Software
#
# Easypanel Nixpacks builder akan auto-detect file ini.
# Vite 5 (esbuild) kompatibel dengan Node 18 — tidak perlu
# nixPkgs custom atau rolldown native binding.
# ============================================================

# Install dependencies (termasuk devDeps untuk build)
[phases.install]
cmds = [
  "npm ci",
  "cd mock-api && npm ci --omit=dev"
]

# Build frontend + copy ke mock-api/static/
[phases.build]
cmds = [
  "npm run build",
  "cp -r dist/ mock-api/static/"
]

# Start server
[phases.start]
cmd = "node mock-api/index.js"

# Environment variables
[env]
NODE_ENV = "production"
PORT = "3000"
MOCK_API_PORT = "3000"

# Health check
[healthcheck]
path = "/health"
interval = 30
timeout = 10
retries = 3

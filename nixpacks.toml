# ============================================================
# Nixpacks — Accounting Software
#
# Easypanel Nixpacks builder akan auto-detect file ini.
# Hindari nixPkgs custom — biarkan Nixpacks pakai Node.js default
# agar native binding (rolldown) terinstall dengan benar.
# ============================================================

# TANPA nixPkgs custom — biarkan Nixpacks pakai default Node.js
# nixPkgs custom menyebabkan rolldown native binding conflict

# Install dependencies (termasuk devDeps untuk build)
[phases.install]
cmds = [
  "npm ci",
  "npm install @rolldown/binding-linux-x64-gnu --no-save",
  "cd mock-api && npm ci --omit=dev"
]

# Build frontend + copy ke mock-api/static/
[phases.build]
cmds = [
  "npm run build",
  "cp -r dist/ mock-api/static/"
]

# Start server
[phases.start]
cmd = "node mock-api/index.js"

# Environment variables
[env]
NODE_ENV = "production"
PORT = "3000"
MOCK_API_PORT = "3000"

# Health check
[healthcheck]
path = "/health"
interval = 30
timeout = 10
retries = 3

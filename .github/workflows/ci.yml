# ============================================================
# CI — Appsheet Accounting Journal
# Tiga job PARALEL (berjalan sekaligus, tidak saling menunggu):
#   1. unit        — unit + integration test PROTOTIPE (Vitest, prototype-accounting;
#                    `npm test` = unit test + integration MSW di src/integration)
#   2. integration — integration test MOCK API (Vitest + Supertest, mock-api)
#   3. e2e         — E2E Playwright RG-01..RG-19 (chromium + firefox)
#
# Keuntungan paralel: unit & integration selesai dalam hitungan detik
# (tidak tertahan oleh E2E ~3 menit); kegagalan satu job TIDAK menahan
# job lain; hasil tiap job terlihat terpisah di badge/status CI.
#
# Playwright menyalakan mock API + Vite sendiri lewat konfigurasi
# `webServer` di e2e/playwright.config.ts (CI=true → reuseExistingServer
# dimatikan, server di-start fresh oleh runner).
#
# Pemicu: setiap push ke branch mana pun + pull request + manual.
# ============================================================
name: CI (Unit + Integration + E2E)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit + Integration test prototipe (Vitest + MSW)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (Vite 8 butuh ^20.19 || >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype-accounting/package-lock.json

      - name: Install dependencies
        working-directory: prototype-accounting
        run: npm ci

      - name: 'Unit + Integration test prototipe (Vitest: unit + MSW)'
        working-directory: prototype-accounting
        run: npm test

  integration:
    name: Integration test mock API (Vitest + Supertest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # CI deterministik: persistence mock API dimatikan — state
      # in-memory, reset ke seed di setiap test (beforeEach).
      MOCK_API_PERSIST: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (Vite 8 butuh ^20.19 || >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mock-api/package-lock.json

      - name: Install dependencies
        working-directory: mock-api
        run: npm ci

      - name: Integration test mock API (Vitest + Supertest)
        working-directory: mock-api
        run: npm test

  e2e:
    name: E2E Playwright RG-01..RG-19 (chromium + firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI deterministik: persistence mock API dimatikan — state
      # in-memory, reset ke seed di setiap test (beforeEach).
      MOCK_API_PERSIST: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (Vite 8 butuh ^20.19 || >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mock-api/package-lock.json
            prototype-accounting/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies (mock-api, prototipe, e2e)
        run: |
          cd mock-api && npm ci
          cd ../prototype-accounting && npm ci
          cd ../e2e && npm ci

      - name: Install Playwright browsers + system deps
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E (RG-01..RG-19)
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test results (trace/screenshot)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7

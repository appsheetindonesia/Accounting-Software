# ============================================================
# CI — Appsheet Accounting Journal
# Pipeline berurutan (satu job, steps sekuensial):
#   1. Unit test prototipe (Vitest, prototype-accounting)
#   2. Integration test mock API (Vitest + Supertest, mock-api)
#   3. E2E Playwright RG-01..RG-12 (chromium + firefox)
#
# Jika salah satu tahap gagal, tahap berikutnya TIDAK dijalankan
# (karena `set -e` default per step) → pipeline berhenti di sana.
#
# Playwright menyalakan mock API + Vite sendiri lewat konfigurasi
# `webServer` di e2e/playwright.config.ts (CI=true →
# reuseExistingServer dimatikan, server di-start fresh oleh runner).
#
# Pemicu: setiap push ke branch mana pun + pull request + manual.
# ============================================================
name: CI (Unit + Integration + E2E)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: unit → integration → e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI deterministik: persistence mock API dimatikan — state
      # in-memory, reset ke seed di setiap test (beforeEach).
      MOCK_API_PERSIST: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (Vite 8 butuh ^20.19 || >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mock-api/package-lock.json
            prototype-accounting/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies (mock-api, prototipe, e2e)
        run: |
          cd mock-api && npm ci
          cd ../prototype-accounting && npm ci
          cd ../e2e && npm ci

      # ---- Tahap 1: unit test prototipe (Vitest) ----
      - name: Unit test prototipe (Vitest)
        working-directory: prototype-accounting
        run: npm test

      # ---- Tahap 2: integration test mock API (Vitest + Supertest) ----
      - name: Integration test mock API (Vitest + Supertest)
        working-directory: mock-api
        run: npm test

      # ---- Tahap 3: E2E Playwright (RG-01..RG-12) ----
      - name: Install Playwright browsers + system deps
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E (RG-01..RG-12)
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test results (trace/screenshot)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7

# ============================================================
# CI — Appsheet Accounting Journal
# Dua job PARALEL (berjalan sekaligus, tidak saling menunggu):
#   1. test — MATRIX per-tahap:
#        • prototipe  (unit + integration, Vitest + MSW)
#        • mock API   (integration, Vitest + Supertest)
#        • lint       (oxlint prototipe — gagal pada error, jadi push/PR
#                      tidak lolos bila ada pelanggaran lint)
#      Setiap tahap menulis laporan JUnit (test-results/junit.xml) DAN
#      cakupan Vitest coverage (coverage/, provider v8 — tabel di log +
#      json-summary/lcov), lalu meng-upload keduanya sebagai artifact:
#      JUnit saat GAGAL, coverage SELALU (nama per tahap, mis.
#      junit-unit-prototipe / junit-unit-prototipe-coverage).
#      ANGKA TEST SAAT INI (update bila berubah): mock API 112 test,
#      prototipe 229 test, E2E RG-01..RG-22 × 2 browser = 44 test.
#   2. e2e     — E2E Playwright RG-01..RG-19 (chromium + firefox)
#   3. qa-sync — gate sinkronisasi artefak QA: CSV/XLSX harus sinkron
#                dengan QA Test Plan (scripts/check-qa-sync.py)
#
# Keuntungan paralel: unit & integration selesai dalam hitungan detik
# (tidak tertahan oleh E2E yang di-shard 2 job paralel); kegagalan satu
# job TIDAK menahan job lain; hasil tiap job terlihat terpisah di
# badge/status CI.
#
# Playwright menyalakan mock API + Vite sendiri lewat konfigurasi
# `webServer` di e2e/playwright.config.ts (CI=true → reuseExistingServer
# dimatikan, server di-start fresh oleh runner).
#
# Pemicu: setiap push ke branch mana pun + pull request + manual.
# JOB test (unit+integration, cepat) dan qa-sync (gate sinkronisasi,
# juga cepat) tetap berjalan di SEMUA push; job e2e (di-shard jadi 2 job
# paralel) di-skip pada push branch non-main agar hemat waktu CI — hanya
# berjalan di push main, pull request, dan manual (lihat if: di job e2e).
# ============================================================
name: CI (Unit + Integration + E2E)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------
  # Guard: nama branch harus sesuai konvensi (fitur/* atau fix/*)
  # saat push ke branch selain main. PR dan workflow_dispatch di-skip.
  # ----------------------------------------------------------------
  branch-guard:
    name: 'Validasi nama branch (fitur/* atau fix/*)'
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Cek konvensi nama branch
        run: |
          BRANCH='${{ github.ref_name }}'
          if [[ "$BRANCH" =~ ^(fitur\/[a-z0-9._-]+|fix\/[a-z0-9._-]+)$ ]]; then
            echo "✅ Branch '$BRANCH' sesuai konvensi (fitur/* atau fix/*)"
          else
            echo "❌ Branch '$BRANCH' tidak sesuai konvensi"
            echo ""
            echo "Konvensi nama branch yang diizinkan:"
            echo "  • fitur/<nama-fitur>   — fitur baru"
            echo "  • fix/<nama-bug>       — perbaikan bug"
            echo "  • main                 — branch utama (push langsung)"
            echo ""
            echo "Contoh: fitur/export-pdf, fix/subtitle-undefined"
            exit 1
          fi

  test:
    name: 'Unit & Integration test — ${{ matrix.tahap }}'
    needs: branch-guard
    if: always() && (needs.branch-guard.result == 'success' || needs.branch-guard.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - tahap: prototipe (Vitest + MSW)
            dir: prototype-accounting
            lock: prototype-accounting/package-lock.json
            artifact: junit-unit-prototipe
          - tahap: mock API (Vitest + Supertest)
            dir: mock-api
            lock: mock-api/package-lock.json
            artifact: junit-integration-mock-api
          - tahap: lint (oxlint prototipe)
            dir: prototype-accounting
            lock: prototype-accounting/package-lock.json
            lint: true
    env:
      # CI deterministik: persistence mock API dimatikan — state
      # in-memory, reset ke seed di setiap test (beforeEach).
      MOCK_API_PERSIST: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24 (Vite 8 butuh ^20.19 || >=22.12)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.lock }}

      - name: Install dependencies (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: npm ci

      # Lint (entry matrix dengan penanda lint:true — hanya prototipe yang
      # punya oxlint). Gagal pada error → push/PR tidak lolos lint.
      - name: 'Lint (oxlint) — ${{ matrix.dir }}'
        if: matrix.lint
        working-directory: ${{ matrix.dir }}
        run: npm run lint

      # JUnit reporter bawaan Vitest + coverage (--coverage, provider v8):
      # output keduanya dipakai artifact debug (default reporter tetap tampil
      # di log). Lokasi stabil per paket: <dir>/test-results/junit.xml dan
      # <dir>/coverage/ (keduanya di-ignore, tidak pernah di-commit).
      - name: 'Test + laporan JUnit + coverage (${{ matrix.dir }})'
        if: ${{ !matrix.lint }}
        working-directory: ${{ matrix.dir }}
        run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Upload hasil test JUnit (saat gagal)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dir }}/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload laporan coverage (${{ matrix.dir }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-coverage
          path: ${{ matrix.dir }}/coverage/
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: E2E RG-01..RG-19 (chromium + firefox) — shard ${{ matrix.shard }}/2
    # Hemat waktu CI: E2E di-shard jadi 2 job PARALEL (tiap job menjalankan
    # setengah suite Playwright via --shard) → wall-clock ±dipotong setengah.
    # Hanya berjalan di jalur yang butuh verifikasi penuh — push ke main,
    # pull request, dan pemicu manual. Push ke branch fitur cukup dengan
    # unit+integration (job test) yang jauh lebih cepat.
    needs: branch-guard
    if: |
      always() &&
      (needs.branch-guard.result == 'success' || needs.branch-guard.result == 'skipped') &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      # CI deterministik: persistence mock API dimatikan — state
      # in-memory, reset ke seed di setiap test (beforeEach).
      MOCK_API_PERSIST: '0'
      # Suite penuh mengirim ratusan request per run — API §1.5 default rate
      # limit 30 req/menit per endpoint bisa memicu 429 palsu. Ambang dinaikkan
      # (penegakan sesungguhnya: env MOCK_RATE_MAX di webServer playwright.config.ts;
      # env job ini mendokumentasikan & mengunci niat di level workflow).
      # RG-21/22 tetap memakai override runtime /admin/set-rate-limit.
      MOCK_RATE_MAX: '100000'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24 (Vite 8 butuh ^20.19 || >=22.12)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mock-api/package-lock.json
            prototype-accounting/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies (mock-api, prototipe, e2e)
        run: |
          cd mock-api && npm ci
          cd ../prototype-accounting && npm ci
          cd ../e2e && npm ci

      - name: Install Playwright browsers + system deps
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E (RG-01..RG-19) — shard ${{ matrix.shard }}/2
        working-directory: e2e
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report (shard ${{ matrix.shard }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test results (shard ${{ matrix.shard }})
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: e2e/test-results/
          retention-days: 7

  qa-sync:
    name: QA artifacts sinkron dengan QA Test Plan
    needs: branch-guard
    if: always() && (needs.branch-guard.result == 'success' || needs.branch-guard.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install openpyxl
        run: pip install openpyxl

      # Backup → regenerate (tanggal run dipin dari yang ter-commit) →
      # bandingkan konten CSV/XLSX. Gagal jika QA Test Plan berubah tanpa
      # artefak di-regenerasi (lihat scripts/check-qa-sync.py).
      - name: Cek sinkronisasi CSV/XLSX dengan QA Test Plan
        run: python scripts/check-qa-sync.py

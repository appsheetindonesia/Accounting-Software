# ============================================================
# CI — Appsheet Accounting Journal
# Dua job PARALEL (berjalan sekaligus, tidak saling menunggu):
#   1. test — MATRIX per-tahap:
#        • prototipe  (unit + integration, Vitest + MSW)
#        • mock API   (integration, Vitest + Supertest)
#      Setiap tahap menulis laporan JUnit (test-results/junit.xml)
#      dan meng-upload-nya sebagai artifact saat GAGAL — debug CI
#      lebih mudah (nama artifact per tahap, mis. junit-unit-prototipe).
#   2. e2e   — E2E Playwright RG-01..RG-19 (chromium + firefox)
#
# Keuntungan paralel: unit & integration selesai dalam hitungan detik
# (tidak tertahan oleh E2E ~3 menit); kegagalan satu job TIDAK menahan
# job lain; hasil tiap job terlihat terpisah di badge/status CI.
#
# Playwright menyalakan mock API + Vite sendiri lewat konfigurasi
# `webServer` di e2e/playwright.config.ts (CI=true → reuseExistingServer
# dimatikan, server di-start fresh oleh runner).
#
# Pemicu: setiap push ke branch mana pun + pull request + manual.
# JOB test (unit+integration, cepat) tetap berjalan di SEMUA push; job e2e
# (~3 menit × 2 browser) di-skip pada push branch non-main agar hemat waktu
# CI — hanya berjalan di push main, pull request, dan manual (lihat if: di
# job e2e).
# ============================================================
name: CI (Unit + Integration + E2E)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 'Unit & Integration test — ${{ matrix.tahap }}'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - tahap: prototipe (Vitest + MSW)
            dir: prototype-accounting
            lock: prototype-accounting/package-lock.json
            artifact: junit-unit-prototipe
          - tahap: mock API (Vitest + Supertest)
            dir: mock-api
            lock: mock-api/package-lock.json
            artifact: junit-integration-mock-api
    env:
      # CI deterministik: persistence mock API dimatikan — state
      # in-memory, reset ke seed di setiap test (beforeEach).
      MOCK_API_PERSIST: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (Vite 8 butuh ^20.19 || >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.lock }}

      - name: Install dependencies (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: npm ci

      # JUnit reporter bawaan Vitest: output dipakai artifact debug saat gagal
      # (default reporter tetap tampil di log). Lokasi stabil per paket:
      # <dir>/test-results/junit.xml (di-ignore, tidak pernah di-commit).
      - name: 'Test + laporan JUnit (${{ matrix.dir }})'
        working-directory: ${{ matrix.dir }}
        run: npx vitest run --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Upload hasil test JUnit (saat gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dir }}/test-results/
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: E2E Playwright RG-01..RG-19 (chromium + firefox)
    # Hemat waktu CI: E2E (~3 menit × 2 browser) hanya untuk jalur yang
    # benar-benar butuh verifikasi penuh — push ke main, pull request,
    # dan pemicu manual. Push ke branch fitur cukup dengan unit+integration
    # (job test) yang jauh lebih cepat.
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI deterministik: persistence mock API dimatikan — state
      # in-memory, reset ke seed di setiap test (beforeEach).
      MOCK_API_PERSIST: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (Vite 8 butuh ^20.19 || >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mock-api/package-lock.json
            prototype-accounting/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies (mock-api, prototipe, e2e)
        run: |
          cd mock-api && npm ci
          cd ../prototype-accounting && npm ci
          cd ../e2e && npm ci

      - name: Install Playwright browsers + system deps
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E (RG-01..RG-19)
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test results (trace/screenshot)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7

# ============================================================
# Build & Deploy prototipe ke GitHub Pages
# Job terpisah dari CI (ci.yml) — workflow ini khusus membangun
# prototipe (prototype-accounting) dan men-deploy hasilnya ke
# GitHub Pages via actions/deploy-pages.
#
#   npm run build (tsc -b && vite build) dengan --base yang
#   diambil dari nama repo (subpath Pages), jadi aset tidak 404.
#   Step Guard memverifikasi dist/index.html benar-benar
#   mereferensikan aset dengan base itu SEBELUM artifact di-upload
#   (base salah → aset 404 setelah deploy; guard menghentikan build).
#
# STATUS JOB DEPLOY: DINONAKTIFKAN SEMENTARA (if: false) sampai GitHub
# Pages diaktifkan di Settings → Pages → Source: "GitHub Actions" —
# repo private plan Free tidak bisa diaktifkan dari Actions (GITHUB_TOKEN
# tidak berwenang), jadi workflow ini berjalan BUILD-ONLY agar tidak
# selalu failure. Setelah Pages aktif, hapus `if: false` di job deploy;
# pre-flight gh api di dalamnya akan langsung mengizinkan deploy.
#
# Catatan: kegagalan run Pages sebelumnya BUKAN karena Pages belum aktif
# (pre-flight skip sudah bekerja) melainkan step Build yang gagal karena
# error tipe tsc -b (fix: GlobalSearch select type + 2 test file) —
# sudah diperbaiki, build kini lulus.
#
# Semua action memakai versi runtime Node 24 (wajib sejak Jun 2026).
# ============================================================
name: Build & Deploy prototipe ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build prototipe (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Sumber tunggal base Pages (subpath dari nama repo) — dipakai step
      # Build (--base) dan step Guard (verifikasi dist/index.html).
      PAGES_BASE: /${{ github.event.repository.name }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24 (Vite 8 butuh ^20.19 || >=22.12)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototype-accounting/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        continue-on-error: true # Pages belum aktif & token tak bisa mengaktifkan → jangan gagalkan build
        with:
          # Aktifkan fitur Pages bila sebelumnya nonaktif (default true,
          # eksplisit di sini agar langkah tidak bergantung pada default).
          # Gagal saat GITHUB_TOKEN tidak berwenang (repo private) — di-
          # toleransi lewat continue-on-error; job deploy yang memutuskan
          # skip/deploy via pre-flight gh api.
          enablement: true

      - name: Install dependencies
        working-directory: prototype-accounting
        run: npm ci

      - name: Build (tsc -b && vite build, base = nama repo)
        working-directory: prototype-accounting
        run: npm run build -- --base=$PAGES_BASE

      # Guard: pastikan hasil build memakai base Pages yang benar sebelum
      # artifact di-upload. Vite menulis <script src="/<repo>/assets/..."> dan
      # <link href="/<repo>/assets/..."> di dist/index.html — jika base salah
      # (mis. "/" atau nama repo berubah), aset akan 404 setelah deploy.
      - name: Guard — verifikasi base Pages di dist/index.html
        working-directory: prototype-accounting
        run: |
          echo "Base Pages yang diharapkan: $PAGES_BASE"
          if ! grep -Eq '(src|href)="'"$PAGES_BASE"'assets/' dist/index.html; then
            echo "::error::dist/index.html tidak mereferensikan aset dengan base Pages ($PAGES_BASE) — aset akan 404 setelah deploy. Periksa argumen --base di step Build."
            exit 1
          fi
          echo "OK — aset direferensikan dengan base Pages ($PAGES_BASE)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: prototype-accounting/dist

  deploy:
    name: Deploy ke GitHub Pages
    needs: build
    # NONAKTIF SEMENTARA sampai Pages diaktifkan di Settings (lihat header).
    # Hapus baris ini setelah konfigurasi Pages selesai — pre-flight gh api
    # di langkah pertama akan mengaktifkan deploy otomatis.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pre-flight: pastikan situs Pages benar-benar aktif sebelum deploy.
      # Bila belum (mis. repo private — GITHUB_TOKEN tidak berwenang
      # mengaktifkan Pages dari Actions), workflow TIDAK gagal: deploy
      # di-skip dengan peringatan yang jelas, artifact tetap tersimpan.
      # Begitu situs diaktifkan, push berikutnya langsung deploy.
      - name: Cek status GitHub Pages
        id: pages-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1
          PAGES_OK=$?
          set -e
          if [ "$PAGES_OK" -ne 0 ]; then
            echo "::warning::GitHub Pages belum diaktifkan — deploy di-skip (artifact build tetap tersimpan). Aktifkan di Settings → Pages → Source: 'GitHub Actions' lalu push ulang."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        id: deployment
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5

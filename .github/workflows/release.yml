# ============================================================
# Release otomatis (tag v*)
# Setiap kali tag rilis (v0.4.0, v0.4.1, ...) di-push ke origin,
# workflow ini langsung membuat GitHub Release untuk tag itu.
#
# Step pembuatan release memanggil scripts/create-release.mjs —
# SATU SUMBER KEBENARAN untuk logika release (dipakai juga untuk
# rilis manual): catatan diambil VERBATIM dari pesan annotated tag
# (subject → judul, body → isi), idempoten (release yang sudah ada
# di-update, bukan duplikat), dan membuat release PUBLISHED
# (draft: false). Kalau mau momen review sebelum publish, buat draft
# manual: `npm run release -- <tag> --draft` (workflow ini tetap
# mem-publish karena tag v* di-push = niat merilis).
#
# Script butuh: objek tag lokal (fetch-depth 0), Node (setup-node),
# dan token → di-resolve otomatis dari env GH_TOKEN/GITHUB_TOKEN
# (di-set ke github.token di sini).
# ============================================================
name: Release otomatis (tag v*)

on:
  push:
    tags:
      - 'v*'

permissions:
  # Membuat release butuh izin tulis ke contents (GITHUB_TOKEN).
  contents: write

jobs:
  release:
    name: Buat GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0: memastikan objek tag (annotated) ikut ter-fetch
      # sehingga pesan tag bisa dibaca lewat git for-each-ref.
      - name: Checkout (history penuh — akses pesan tag)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # GITHUB_REF_NAME = nama tag (mis. v0.4.2) pada push tag.
      # Script: baca catatan dari tag → POST/PATCH release via REST API.
      - name: Buat GitHub Release dari annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/create-release.mjs ${GITHUB_REF_NAME}

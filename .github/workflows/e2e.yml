# ============================================================
# E2E Regression (manual) — Appsheet Accounting Journal
# Menjalankan suite Playwright RG-01..RG-19 (chromium + firefox)
# terhadap mock API (localhost:4000) + prototipe Vite (:5173).
#
# CATATAN: E2E juga dijalankan OTOMATIS di setiap push/PR oleh
# workflow terpadu `.github/workflows/ci.yml` (unit → integration
# → e2e). Workflow ini hanya untuk menjalankan E2E secara manual
# tanpa harus menunggu pipeline penuh.
#
# Playwright otomatis menyalakan kedua server lewat konfigurasi
# `webServer` di e2e/playwright.config.ts (CI=true → reuseExistingServer
# dimatikan, server selalu di-start fresh oleh runner).
# ============================================================
name: E2E Regression (manual)

on:
  workflow_dispatch:

jobs:
  e2e:
    name: RG-01..RG-19 (chromium + firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI deterministik: persistence mock API dimatikan — state
      # in-memory, reset ke seed di setiap test (beforeEach).
      MOCK_API_PERSIST: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (Vite 8 butuh ^20.19 || >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mock-api/package-lock.json
            prototype-accounting/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies (mock-api, prototipe, e2e)
        run: |
          cd mock-api && npm ci
          cd ../prototype-accounting && npm ci
          cd ../e2e && npm ci

      - name: Install Playwright browsers + system deps
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E (RG-01..RG-19)
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test results (trace/screenshot)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7

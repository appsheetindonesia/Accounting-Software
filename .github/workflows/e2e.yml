# ============================================================
# E2E Playwright — Appsheet Accounting Journal
# Satu job: suite E2E RG-01..RG-19 (chromium + firefox) terhadap
# mock API (localhost:4000) + prototipe Vite (:5173).
#
# Unit/integration test (prototipe + mock API) dan gate qa-sync TIDAK
# dijalankan di sini — keduanya sudah menjadi satu-satunya sumber
# kebenaran di `.github/workflows/ci.yml` (matrix test + lint + qa-sync)
# yang berjalan otomatis di setiap push/PR. Workflow ini fokus murni
# pada verifikasi E2E agar tidak ada dua sumber kebenaran yang bisa
# berbeda hasilnya.
#
# E2E di-shard jadi 2 job PARALEL (--shard=i/2) → wall-clock ±dipotong
# setengah.
#
# Pemicu (skema sama dengan job e2e di ci.yml — E2E hanya untuk jalur
# yang benar-benar butuh verifikasi penuh):
#   • push ke main          — setiap batch fitur/fix yang masuk main
#   • pull request          — verifikasi sebelum merge
#   • workflow_dispatch     — manual kapan saja tanpa harus push
# Push ke branch fitur (`fitur/*`, `fix/*`) TIDAK memicu workflow ini —
# cukup unit+integration dari ci.yml yang jauh lebih cepat.
#
# Playwright otomatis menyalakan kedua server lewat konfigurasi
# `webServer` di e2e/playwright.config.ts (CI=true → reuseExistingServer
# dimatikan, server selalu di-start fresh oleh runner).
# ============================================================
name: E2E Playwright (chromium + firefox)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: E2E RG-01..RG-19 (chromium + firefox) — shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      # CI deterministik: persistence mock API dimatikan — state
      # in-memory, reset ke seed di setiap test (beforeEach).
      MOCK_API_PERSIST: '0'
      # Suite penuh mengirim ratusan request per run — API §1.5 default rate
      # limit 30 req/menit per endpoint bisa memicu 429 palsu. Ambang dinaikkan
      # (penegakan sesungguhnya: env MOCK_RATE_MAX di webServer playwright.config.ts
      # yang dipakai Playwright saat menyalakan mock API; env job ini mendokumentasikan
      # & mengunci niat di level workflow). RG-21/22 tetap memakai override runtime
      # /admin/set-rate-limit yang menang atas env.
      MOCK_RATE_MAX: '100000'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24 (Vite 8 butuh ^20.19 || >=22.12)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mock-api/package-lock.json
            prototype-accounting/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies (mock-api, prototipe, e2e)
        run: |
          cd mock-api && npm ci
          cd ../prototype-accounting && npm ci
          cd ../e2e && npm ci

      - name: Install Playwright browsers + system deps
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E (RG-01..RG-19) — shard ${{ matrix.shard }}/2
        working-directory: e2e
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report (shard ${{ matrix.shard }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test results (shard ${{ matrix.shard }})
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.shard }}
          path: e2e/test-results/
          retention-days: 7

# ============================================================
# Verifikasi penuh — Appsheet Accounting Journal
# Tiga job PARALEL:
#   1. unit    — unit + integration test PROTOTIPE (Vitest + MSW) dan
#                integration test MOCK API (Vitest + Supertest)
#   2. e2e     — suite Playwright RG-01..RG-19 (chromium + firefox)
#                terhadap mock API (localhost:4000) + prototipe Vite (:5173).
#   3. qa-sync — gate sinkronisasi artefak QA: CSV/XLSX harus sinkron
#                dengan QA Test Plan (scripts/check-qa-sync.py).
#
# Pemicu (skema sama dengan job e2e di ci.yml — E2E hanya untuk jalur
# yang benar-benar butuh verifikasi penuh):
#   • push ke main          — setiap batch fitur/fix yang masuk main
#   • pull request          — verifikasi sebelum merge
#   • workflow_dispatch     — manual kapan saja tanpa harus push
# Push ke branch fitur (`fitur/*`, `fix/*`) TIDAK memicu workflow ini —
# cukup unit+integration dari ci.yml yang jauh lebih cepat.
#
# Playwright otomatis menyalakan kedua server lewat konfigurasi
# `webServer` di e2e/playwright.config.ts (CI=true → reuseExistingServer
# dimatikan, server selalu di-start fresh oleh runner).
# ============================================================
name: Verifikasi penuh (unit + e2e)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit test prototipe + mock API (Vitest + Supertest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # CI deterministik: persistence mock API dimatikan — state
      # in-memory, reset ke seed di setiap test (beforeEach).
      MOCK_API_PERSIST: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24 (Vite 8 butuh ^20.19 || >=22.12)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mock-api/package-lock.json
            prototype-accounting/package-lock.json

      # JUnit reporter bawaan Vitest — konsisten dengan ci.yml: laporan
      # per paket di <dir>/test-results/junit.xml (di-ignore, tidak pernah
      # di-commit), di-upload sebagai artifact saat gagal dengan nama yang
      # sama (junit-unit-prototipe / junit-integration-mock-api).
      - name: 'Install dependencies + test prototipe (Vitest: unit + MSW, laporan JUnit)'
        working-directory: prototype-accounting
        run: |
          npm ci
          npx vitest run --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Upload hasil test JUnit prototipe (saat gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-prototipe
          path: prototype-accounting/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Install dependencies + test mock API (Vitest + Supertest, laporan JUnit)
        working-directory: mock-api
        run: |
          npm ci
          npx vitest run --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Upload hasil test JUnit mock API (saat gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration-mock-api
          path: mock-api/test-results/
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: RG-01..RG-19 (chromium + firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI deterministik: persistence mock API dimatikan — state
      # in-memory, reset ke seed di setiap test (beforeEach).
      MOCK_API_PERSIST: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24 (Vite 8 butuh ^20.19 || >=22.12)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mock-api/package-lock.json
            prototype-accounting/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies (mock-api, prototipe, e2e)
        run: |
          cd mock-api && npm ci
          cd ../prototype-accounting && npm ci
          cd ../e2e && npm ci

      - name: Install Playwright browsers + system deps
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E (RG-01..RG-19)
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test results (trace/screenshot)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7

  qa-sync:
    name: QA artifacts sinkron dengan QA Test Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install openpyxl
        run: pip install openpyxl

      # Backup → regenerate (tanggal run dipin dari yang ter-commit) →
      # bandingkan konten CSV/XLSX. Gagal jika QA Test Plan berubah tanpa
      # artefak di-regenerasi (lihat scripts/check-qa-sync.py).
      - name: Cek sinkronisasi CSV/XLSX dengan QA Test Plan
        run: python scripts/check-qa-sync.py

# ============================================================
# E2E Playwright — Appsheet Accounting Journal
# 4 job paralel: 2 browser × 2 shard — tiap job menjalankan 1 browser
# saja (install & eksekusi lebih cepat, distribusi waktu lebih merata).
#
# Unit/integration test (prototipe + mock API) dan gate qa-sync TIDAK
# dijalankan di sini — keduanya sudah menjadi satu-satunya sumber
# kebenaran di `.github/workflows/ci.yml`.
#
# Pemicu (skema sama dengan job e2e di ci.yml):
#   • push ke main          — setiap batch fitur/fix yang masuk main
#   • pull request          — verifikasi sebelum merge
#   • workflow_dispatch     — manual kapan saja tanpa harus push
# Push ke branch fitur (`fitur/*`, `fix/*`) TIDAK memicu workflow ini.
#
# Playwright otomatis menyalakan kedua server lewat konfigurasi
# `webServer` di e2e/playwright.config.ts (CI=true → reuseExistingServer
# dimatikan, server selalu di-start fresh oleh runner).
# ============================================================
name: E2E Playwright (chromium + firefox)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: E2E ${{ matrix.browser }} — shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        shard: [1, 2]
    env:
      # CI deterministik: persistence mock API dimatikan — state
      # in-memory, reset ke seed di setiap test (beforeEach).
      MOCK_API_PERSIST: '0'
      # Suite penuh mengirim ratusan request per run — API §1.5 default rate
      # limit 30 req/menit per endpoint bisa memicu 429 palsu. Ambang dinaikkan
      # (penegakan sesungguhnya: env MOCK_RATE_MAX di webServer playwright.config.ts
      # yang dipakai Playwright saat menyalakan mock API; env job ini mendokumentasikan
      # & mengunci niat di level workflow). RG-21/22 tetap memakai override runtime
      # /admin/set-rate-limit yang menang atas env.
      MOCK_RATE_MAX: '100000'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24 (Vite 8 butuh ^20.19 || >=22.12)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mock-api/package-lock.json
            prototype-accounting/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies (mock-api, prototipe, e2e)
        run: |
          cd mock-api && npm ci
          cd ../prototype-accounting && npm ci
          cd ../e2e && npm ci

      # Retry install Playwright — CDN kadang stall di runner baru;
      # 3 attempt dengan backoff 10s/30s. Hanya install 1 browser per job.
      - name: Install Playwright (${{ matrix.browser }}) + system deps
        working-directory: e2e
        run: |
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt/3 ==="
            npx playwright install --with-deps ${{ matrix.browser }} && exit 0
            echo "⚠️ Attempt $attempt failed, retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "❌ Semua attempt gagal"
          exit 1

      - name: Run E2E — ${{ matrix.browser }} shard ${{ matrix.shard }}/2
        working-directory: e2e
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report (${{ matrix.browser }}-${{ matrix.shard }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test results (${{ matrix.browser }}-${{ matrix.shard }})
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: e2e/test-results/
          retention-days: 7

# ============================================================
# Railpack — Accounting Software
#
# Easypanel Railpack builder akan auto-detect file ini.
# ============================================================

# Provider
provider = "node"

# Node.js version (Vite 5 kompatibel dengan Node 18)
node_version = "18"

# Install dependencies (termasuk devDeps untuk build)
install = "npm ci && cd mock-api && npm ci --omit=dev"

# Build command (frontend)
build = "npm run build && cp -r dist/ mock-api/static/"

# Start command
start = "node mock-api/index.js"

# Environment variables
[env]
NODE_ENV = "production"
PORT = "3000"
MOCK_API_PORT = "3000"

# Health check
[healthcheck]
path = "/health"
interval = 30
timeout = 10
retries = 3

# ============================================================
# Railpack — Accounting Software
#
# Easypanel Railpack builder akan auto-detect file ini.
# Railpack membangun image berdasarkan package.json + config ini.
# ============================================================

# Provider
provider = "node"

# Node.js version
node_version = "22"

# Install dependencies
install = "npm ci && npm install @rolldown/binding-linux-x64-gnu --no-save && cd mock-api && npm ci --omit=dev"

# Build command (frontend)
build = "npm run build && cp -r dist/ mock-api/static/"

# Start command
start = "node mock-api/index.js"

# Environment variables
[env]
NODE_ENV = "production"
PORT = "3000"
MOCK_API_PORT = "3000"

# Health check
[healthcheck]
path = "/health"
interval = 30
timeout = 10
retries = 3
